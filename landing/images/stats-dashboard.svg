<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgDash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgDash)"/>

  <g fill="#ffffff" opacity="0.07">
    <circle cx="1060" cy="120" r="4"/><circle cx="1120" cy="120" r="4"/>
    <circle cx="1060" cy="160" r="4"/><circle cx="1120" cy="160" r="4"/>
  </g>

  <!-- dashboard card -->
  <rect x="140" y="130" width="920" height="540" rx="26" fill="#ffffff"/>

  <!-- header row -->
  <rect x="184" y="176" width="200" height="18" rx="9" fill="#1e293b"/>
  <rect x="184" y="202" width="140" height="12" rx="6" fill="#94a3b8"/>
  <g transform="translate(860,176)">
    <rect width="96" height="34" rx="17" fill="#dcfce7"/>
    <path d="M18 17l6 6 12-13" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>
    <rect x="42" y="12" width="42" height="10" rx="5" fill="#16a34a" opacity="0.55"/>
  </g>

  <!-- bar chart -->
  <g transform="translate(184,260)">
    <line x1="0" y1="330" x2="820" y2="330" stroke="#e3e6ee" stroke-width="2"/>
    <rect x="30" y="210" width="90" height="120" rx="10" fill="url(#barGrad)"/>
    <rect x="150" y="150" width="90" height="180" rx="10" fill="url(#barGrad)"/>
    <rect x="270" y="190" width="90" height="140" rx="10" fill="url(#barGrad)"/>
    <rect x="390" y="90" width="90" height="240" rx="10" fill="url(#barGrad)"/>
    <rect x="510" y="120" width="90" height="210" rx="10" fill="url(#barGrad)"/>
    <rect x="630" y="60" width="90" height="270" rx="10" fill="#4f46e5"/>

    <!-- trend line -->
    <polyline points="75,220 195,165 315,205 435,105 555,135 675,75"
      fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="675" cy="75" r="7" fill="#ffffff"/>
  </g>

  <!-- side stat pills -->
  <g transform="translate(184,632)">
    <circle cx="8" cy="8" r="8" fill="#4f46e5"/>
    <rect x="26" y="2" width="150" height="12" rx="6" fill="#334155"/>
    <rect x="26" y="18" width="90" height="8" rx="4" fill="#cbd5e1"/>
  </g>
  <g transform="translate(464,632)">
    <circle cx="8" cy="8" r="8" fill="#22c55e"/>
    <rect x="26" y="2" width="150" height="12" rx="6" fill="#334155"/>
    <rect x="26" y="18" width="110" height="8" rx="4" fill="#cbd5e1"/>
  </g>
  <g transform="translate(744,632)">
    <circle cx="8" cy="8" r="8" fill="#f59e0b"/>
    <rect x="26" y="2" width="130" height="12" rx="6" fill="#334155"/>
    <rect x="26" y="18" width="80" height="8" rx="4" fill="#cbd5e1"/>
  </g>
</svg>
