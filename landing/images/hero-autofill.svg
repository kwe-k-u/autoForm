<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgAutofill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardShadowA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgAutofill)"/>

  <!-- soft dot grid -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="120" cy="120" r="4"/><circle cx="220" cy="120" r="4"/><circle cx="320" cy="120" r="4"/>
    <circle cx="120" cy="220" r="4"/><circle cx="220" cy="220" r="4"/><circle cx="320" cy="220" r="4"/>
    <circle cx="1280" cy="720" r="4"/><circle cx="1380" cy="720" r="4"/><circle cx="1480" cy="720" r="4"/>
    <circle cx="1280" cy="800" r="4"/><circle cx="1380" cy="800" r="4"/><circle cx="1480" cy="800" r="4"/>
  </g>

  <!-- browser card shadow -->
  <ellipse cx="800" cy="700" rx="420" ry="40" fill="url(#cardShadowA)"/>

  <!-- browser card -->
  <g>
    <rect x="440" y="200" width="720" height="480" rx="24" fill="#ffffff"/>
    <!-- header -->
    <rect x="440" y="200" width="720" height="64" rx="24" fill="#f6f7fb"/>
    <rect x="440" y="240" width="720" height="24" fill="#f6f7fb"/>
    <circle cx="478" cy="232" r="7" fill="#fb7185"/>
    <circle cx="504" cy="232" r="7" fill="#fbbf24"/>
    <circle cx="530" cy="232" r="7" fill="#34d399"/>
    <rect x="580" y="220" width="400" height="24" rx="12" fill="#e3e6ee"/>

    <!-- form fields -->
    <g>
      <rect x="500" y="316" width="140" height="14" rx="7" fill="#c7cddb"/>
      <rect x="500" y="340" width="600" height="40" rx="10" fill="#eef1f8"/>

      <rect x="500" y="404" width="160" height="14" rx="7" fill="#c7cddb"/>
      <rect x="500" y="428" width="600" height="40" rx="10" fill="#eef1f8"/>
      <circle cx="1068" cy="448" r="16" fill="#22c55e"/>
      <path d="M1060 448l6 6 12-13" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="500" y="492" width="120" height="14" rx="7" fill="#c7cddb"/>
      <rect x="500" y="516" width="600" height="40" rx="10" fill="#eef1f8"/>
      <circle cx="1068" cy="536" r="16" fill="#22c55e"/>
      <path d="M1060 536l6 6 12-13" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- floating "autofilled" badge -->
  <g transform="translate(1000,588)">
    <rect x="0" y="0" width="176" height="56" rx="28" fill="#0f172a"/>
    <circle cx="28" cy="28" r="14" fill="#4f46e5"/>
    <path d="M21 28l5 5 10-11" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="20" width="100" height="8" rx="4" fill="#94a3b8"/>
    <rect x="54" y="34" width="70" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
