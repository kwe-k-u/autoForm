<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgNetwork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b8f"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="glowNetwork" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgNetwork)"/>
  <circle cx="800" cy="450" r="380" fill="url(#glowNetwork)"/>

  <!-- connecting edges -->
  <g stroke="#c7d2fe" stroke-width="1.5" opacity="0.45">
    <line x1="800" y1="450" x2="560" y2="300"/>
    <line x1="800" y1="450" x2="1040" y2="300"/>
    <line x1="800" y1="450" x2="1080" y2="560"/>
    <line x1="800" y1="450" x2="600" y2="620"/>
    <line x1="800" y1="450" x2="420" y2="470"/>
    <line x1="800" y1="450" x2="1220" y2="420"/>
    <line x1="560" y1="300" x2="420" y2="470"/>
    <line x1="1040" y1="300" x2="1220" y2="420"/>
    <line x1="600" y1="620" x2="1080" y2="560"/>
  </g>

  <!-- outer nodes -->
  <g fill="#93c5fd">
    <circle cx="560" cy="300" r="10"/>
    <circle cx="1040" cy="300" r="10"/>
    <circle cx="1080" cy="560" r="10"/>
    <circle cx="600" cy="620" r="10"/>
    <circle cx="420" cy="470" r="8"/>
    <circle cx="1220" cy="420" r="8"/>
  </g>

  <!-- small satellite dots -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="480" cy="230" r="4"/>
    <circle cx="1120" cy="220" r="4"/>
    <circle cx="1160" cy="640" r="4"/>
    <circle cx="500" cy="700" r="4"/>
    <circle cx="300" cy="380" r="4"/>
    <circle cx="1300" cy="500" r="4"/>
  </g>

  <!-- hub node -->
  <circle cx="800" cy="450" r="30" fill="#0f172a"/>
  <circle cx="800" cy="450" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <path d="M788 450l8 8 18-20" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
